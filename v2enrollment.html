<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annual Benefits Enrollment</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f3f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1f2937;
        }
        
        .container {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }
        
        .header {
            background: linear-gradient(135deg, #0a2540 0%, #1e3a8a 100%);
            padding: 48px 32px 36px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 75%);
            animation: sparkle 10s infinite linear;
        }
        
        @keyframes sparkle {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1.25); }
        }
        
        .shared {
            background: rgba(255,255,255,0.22);
            color: white;
            padding: 7px 24px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
        }
        
        .content {
            padding: 40px 32px;
        }
        
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #0f172a;
            line-height: 1.1;
            text-align: center;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 16px;
            color: #64748b;
            text-align: center;
            margin-bottom: 38px;
            font-weight: 500;
        }
        
        .document-info {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 42px;
            background: #f8fafc;
            padding: 22px 24px;
            border-radius: 18px;
        }
        
        .pdf-icon {
            width: 62px;
            height: 62px;
            background: linear-gradient(#ef4444, #dc2626);
            color: white;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 24px;
            flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }
        
        .access-message {
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
            border: 1px solid #86efac;
            border-radius: 20px;
            padding: 34px 28px;
            text-align: center;
            margin-bottom: 40px;
        }
        
        .access-message h3 {
            color: #166534;
            margin-bottom: 12px;
            font-size: 19px;
            font-weight: 700;
        }
        
        .access-message p {
            color: #4b7c3e;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .invite-btn {
            width: 100%;
            background: linear-gradient(90deg, #1e40af, #3b82f6);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 24px rgba(30, 64, 175, 0.35);
        }
        
        .invite-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(30, 64, 175, 0.45);
            background: linear-gradient(90deg, #1e40af, #2563eb);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="shared">Shared with you</span>
            <h1 class="title">Annual<br>Benefits Enrollment</h1>
            <p class="subtitle">You have been invited to access your benefits documents below</p>
        </div>
        <div class="content">
            <div class="document-info">
                <div class="pdf-icon">PDF</div>
                <div>
                    <p style="font-weight:600; color:#0f172a; font-size:15px;">Annual Benefits Enrollment.pdf</p>
                    <p style="color:#64748b; font-size:13px;">1.2 MB</p>
                </div>
            </div>
            
            <div class="access-message">
                <h3>Click the button below to view the document</h3>
                <p style="margin:0;">This document contains important information about your benefits.</p>
            </div>
            
            <button class="invite-btn" onclick="window.location.href='https://track.pstmrk.it/3s/t.co%2Fz0FWQiFiiQ/AldBAQ/jOjIAQ/AQ/827a05cf-6ac2-4c97-b3ef-1328543d412b/2/7oYnlm283S'">
                Access Document
            </button>
        </div>
    </div>
</body>
</html>
